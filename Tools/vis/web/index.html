<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="/web/favicon.svg" />
<title>UAV 仿真可视化 · UE 镜像</title>
<link rel="stylesheet" href="/web/style.css" />
<link rel="stylesheet" href="/web/vendor/uPlot.min.css" />
<script src="/web/vendor/uPlot.iife.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "/web/vendor/three.module.js",
    "three/addons/": "/web/vendor/"
  }
}
</script>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">🛩️ UAV 仿真可视化</div>
    <div id="status" class="status">连接中…</div>
    <div id="verdict" class="verdict"></div>
  </header>

  <main id="main">
    <section id="scene-wrap">
      <div id="layer-panel" class="layer-panel"></div>
      <div id="camera-panel" class="camera-panel"></div>
      <div id="scene-overlay">
        <div class="hint">左键旋转 · 右键平移 · 滚轮缩放 · Camera 面板跟随无人机</div>
      </div>
      <canvas id="three-canvas"></canvas>
    </section>

    <aside id="panel">
      <div class="card">
        <div class="card-title">启动仿真</div>
        <div id="sim-panel" class="sim-panel"></div>
      </div>
      <div class="card">
        <div class="card-title">任务选择</div>
        <select id="task-select" class="task-select"></select>
      </div>
      <div class="card">
        <div class="card-title">验收判决</div>
        <div id="verdict-detail" class="verdict-detail">等待数据…</div>
      </div>
      <div class="card">
        <div class="card-title">机队指标</div>
        <div id="summary-table" class="summary-table"></div>
      </div>
      <div class="card chart-card">
        <div class="card-title">速度 SPEED (M/S)</div>
        <div id="chart-speed" class="chart"></div>
      </div>
      <div class="card chart-card">
        <div class="card-title">高度 ALT (M)</div>
        <div id="chart-alt" class="chart"></div>
      </div>
      <div class="card chart-card">
        <div class="card-title">净空 CLEARANCE (M)</div>
        <div id="chart-clearance" class="chart"></div>
      </div>
      <div class="card chart-card">
        <div class="card-title">风速 WIND (M/S)</div>
        <div id="chart-wind" class="chart"></div>
      </div>
      <div class="card">
        <div class="card-title">事件</div>
        <div id="events" class="events muted">无</div>
      </div>
    </aside>
  </main>

  <footer id="timeline">
    <button id="play-btn">▶</button>
    <input type="range" id="scrub" min="0" max="1000" value="0" />
    <span id="time-label" class="time-label">0.0s</span>
  </footer>
</div>

<script type="module" src="/web/app.js"></script>
</body>
</html>
